services:

  consul:
    image: hashicorp/consul:1.19
    container_name: consul
    ports:
      - "8500:8500"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    networks:
      - ais-network

  auth:
    build: ./auth_service
    container_name: auth
    environment:
      - INSTANCE_NAME=auth-1
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - PORT=8000
    depends_on:
      - consul
    networks:
      - ais-network

  catalog-1:
    build: ./catalog_service
    container_name: catalog-1
    environment:
      - INSTANCE_NAME=catalog-1
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - PORT=8000
    depends_on:
      - consul
    networks:
      - ais-network

  catalog-2:
    build: ./catalog_service
    container_name: catalog-2
    environment:
      - INSTANCE_NAME=catalog-2
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - PORT=8000
    depends_on:
      - consul
    networks:
      - ais-network

  order:
    build: ./order_service
    container_name: order
    environment:
      - INSTANCE_NAME=order-1
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - PORT=8000
    depends_on:
      - consul
    networks:
      - ais-network

  gateway:
    build: ./gateway_service
    container_name: gateway
    environment:
      - INSTANCE_NAME=gateway-1
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - PORT=8000
    depends_on:
      - consul
      - order
      - catalog-1
    networks:
      - ais-network

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - catalog-1
      - catalog-2
      - order
    networks:
      - ais-network

networks:
  ais-network:
    driver: bridge